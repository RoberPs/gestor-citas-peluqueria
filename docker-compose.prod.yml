# Production deployment: one salon, one application process, TLS terminated at
# the proxy.
#
# The single process is not an accident of scale. The rate limiter lives in
# process memory (D-007), so a second worker would give each one its own
# counters and halve the effective limit for nobody's benefit. Scaling out
# means moving that counter to PostgreSQL first.

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SALON_DOMAIN: ${SALON_DOMAIN:?set SALON_DOMAIN to the salon domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published ports: the application is reachable only through the proxy,
    # which is what makes the `X-Forwarded-For` it sets trustworthy.
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/salon
      SALON_TIMEZONE: ${SALON_TIMEZONE:-Europe/Madrid}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?set RATE_LIMIT_SECRET}
      # The proxy is the only thing that can reach the app, and this is its
      # address on the compose network. Without it the per-IP limits are
      # trivially bypassed by setting the header (D-007).
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-proxy}
      PUBLIC_BASE_URL: https://${SALON_DOMAIN}
      # 004: the confirmation email. Off unless set; with `on` the app refuses
      # to start without the key, the sender and the seal key. The API base is
      # Resend's own and is not set here.
      NOTIFICATIONS_EMAIL: ${NOTIFICATIONS_EMAIL:-off}
      NOTIFICATIONS_SMS: 'off'
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      NOTIFICATION_SEAL_KEY: ${NOTIFICATION_SEAL_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: salon
    # No published ports either: only the application talks to it.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d salon']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  caddy_data:
  caddy_config:
