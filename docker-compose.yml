services:
  db:
    image: postgres:16-alpine
    container_name: salon_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon
    ports:
      - '5434:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d salon']
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: salon_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salon_test
    ports:
      - '5433:5432'
    volumes:
      - db_test_data:/var/lib/postgresql/data
    # The test database is disposable: fsync off buys a faster suite.
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d salon_test']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  db_test_data:
