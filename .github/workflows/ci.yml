name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: nothing is gained by finishing a run
# nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, layers and the whole test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # A real PostgreSQL 16, because the central guarantee of this feature is
      # a database constraint and simulating it would test the simulation.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: salon_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d salon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@127.0.0.1:5433/salon_test
      SALON_TIMEZONE: Europe/Madrid
      RATE_LIMIT_SECRET: ci-rate-limit-secret
      TRUSTED_PROXY_IPS: 127.0.0.1
      PUBLIC_BASE_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every job below blocks the merge. A principle that does not block the
      # merge is a principle that erodes by the third sprint.
      - name: Lint and typecheck
        run: npm run lint

      - name: Layer boundary
        run: npm run check:layers

      - name: Install the browser the e2e suite drives
        run: npx playwright install --with-deps chromium

      - name: Unit, integration, contract and end-to-end suites
        run: npm run test:all

      - name: Keep the Playwright report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
